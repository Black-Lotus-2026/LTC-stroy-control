# =============================================================================
# Конфигурация вторичной верификации инцидентов VLM (Google Gemini Vision API)
# =============================================================================

# Флаг активности VLM обработки инцидентов.
# Установлен в false, чтобы VLM сейчас не обрабатывала запросы (настраивается отдельно после YOLO).
enabled: false

# Провайдер и модель нейросети
provider: "gemini"
model: "gemini-1.5-flash"

# Ограничение частоты запросов: не чаще чем раз в 60 секунд (не чаще 1 запроса в минуту)
min_request_interval_seconds: 60
max_requests_per_minute: 1

# Таймаут ожидания ответа VLM в секундах
request_timeout_seconds: 15

# Режим отладки и подробного логирования
debug_logging: false
