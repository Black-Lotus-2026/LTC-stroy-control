# Полный стенд: API, воркер детекции, планировщик, база, брокер.
# Запуск: make up   (или docker compose up --build)

services:
  ppr_llm:
    image: ollama/ollama@sha256:265409e1d931028a8f7d5a32bcbafddd7bffbc6cc629d77efe9560adf692a5e7
    restart: unless-stopped
    cpus: 6.0
    mem_limit: 12g
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ppr_models_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ppr_model_init:
    image: ollama/ollama@sha256:265409e1d931028a8f7d5a32bcbafddd7bffbc6cc629d77efe9560adf692a5e7
    environment:
      OLLAMA_HOST: http://ppr_llm:11434
    command: ["pull", "qwen2.5:7b"]
    depends_on:
      ppr_llm:
        condition: service_healthy

  ppr_worker:
    env_file:
      - ./backend/.env
    build: ./backend
    restart: unless-stopped
    command: celery -A app.workers.celery_app:celery_app worker -Q ppr -c 1 -l info
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      PPR_STORAGE_ROOT: /app/var/documents
      CAMERA_VIEW_STORAGE_ROOT: /app/var/camera-views-private
      PPR_PROVIDER: ollama
      PPR_OLLAMA_URL: http://ppr_llm:11434
      PPR_ANALYSIS_MODEL: qwen2.5:7b
    volumes:
      - ./backend:/app
      - ppr_documents_data:/app/var/documents
      - camera_views_private:/app/var/camera-views-private
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ppr_model_init:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stroy
      POSTGRES_PASSWORD: stroy
      POSTGRES_DB: stroy_control
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Наружу нестандартный порт: на машинах участников часто уже стоит
      # локальный PostgreSQL, и 5432 оказывается занят. Внутри сети compose
      # сервисы по-прежнему ходят на 5432.
      - "5433:5432"
    healthcheck:
      # Остальные сервисы ждут именно готовности принимать запросы,
      # а не просто старта контейнера.
      test: ["CMD-SHELL", "pg_isready -U stroy -d stroy_control"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # То же соображение, что и с PostgreSQL: локальный Redis не должен
      # мешать поднять стенд.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    env_file:
      - ./backend/.env
    build: ./backend
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      ENVIRONMENT: docker
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      STORAGE_LOCAL_ROOT: /app/var/storage
      PPR_STORAGE_ROOT: /app/var/documents
      CAMERA_VIEW_STORAGE_ROOT: /app/var/camera-views-private
      PPR_PROVIDER: ollama
      PPR_OLLAMA_URL: http://ppr_llm:11434
      PPR_ANALYSIS_MODEL: qwen2.5:7b
      STORAGE_PUBLIC_URL: http://localhost:8000/media
      REPORT_LLM_ENABLED: ${REPORT_LLM_ENABLED:-false}
      REPORT_LLM_MODEL: ${REPORT_LLM_MODEL:-gpt-5.5}
      REPORT_LLM_REASONING_EFFORT: ${REPORT_LLM_REASONING_EFFORT:-low}
      REPORT_LLM_TIMEOUT_SECONDS: ${REPORT_LLM_TIMEOUT_SECONDS:-30}
      REPORT_LLM_MAX_RETRIES: ${REPORT_LLM_MAX_RETRIES:-2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      YOLO_WEIGHTS_PATH: ${YOLO_WEIGHTS_PATH:-/app/weights/construction-yolov8m-v2.pt}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    volumes:
      # Код примонтирован — правки применяются без пересборки образа.
      - ./backend:/app
      - storage_data:/app/var/storage
      - ppr_documents_data:/app/var/documents
      - camera_views_private:/app/var/camera-views-private
      # Исходные файлы организаторов (справочник работ, ссылки на датасеты).
      - ./data:/app/data:ro
      - ./info:/app/info:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    env_file:
      - ./backend/.env
    build: ./backend
    # Две очереди в одном воркере на время прототипа; когда появится модель,
    # очередь cv выносится в отдельный сервис с своим параллелизмом.
    command: celery -A app.workers.celery_app:celery_app worker -Q default,cv -c 2 -l info
    environment:
      ENVIRONMENT: docker
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      STORAGE_LOCAL_ROOT: /app/var/storage
      PPR_STORAGE_ROOT: /app/var/documents
      CAMERA_VIEW_STORAGE_ROOT: /app/var/camera-views-private
      REPORT_LLM_ENABLED: ${REPORT_LLM_ENABLED:-false}
      REPORT_LLM_MODEL: ${REPORT_LLM_MODEL:-gpt-5.5}
      REPORT_LLM_REASONING_EFFORT: ${REPORT_LLM_REASONING_EFFORT:-low}
      REPORT_LLM_TIMEOUT_SECONDS: ${REPORT_LLM_TIMEOUT_SECONDS:-30}
      REPORT_LLM_MAX_RETRIES: ${REPORT_LLM_MAX_RETRIES:-2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      YOLO_WEIGHTS_PATH: ${YOLO_WEIGHTS_PATH:-/app/weights/construction-yolov8m-v2.pt}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    volumes:
      - ./backend:/app
      - storage_data:/app/var/storage
      - ppr_documents_data:/app/var/documents
      - camera_views_private:/app/var/camera-views-private
      - ./data:/app/data:ro
      - ./info:/app/info:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    # Файл расписания пишется вне примонтированного кода, чтобы beat не
    # оставлял служебные файлы в репозитории.
    command: celery -A app.workers.celery_app:celery_app beat -l info --schedule /tmp/celerybeat-schedule
    environment:
      ENVIRONMENT: docker
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      CAMERA_VIEW_STORAGE_ROOT: /app/var/camera-views-private
    volumes:
      - ./backend:/app
      - camera_views_private:/app/var/camera-views-private
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      # Empty: the browser uses the site's hostname and API port 8000.
      # Set an explicit public API origin when using a domain or HTTPS proxy.
      VITE_API_URL: ${VITE_API_URL:-}
      # Vite accepts IP addresses by default; explicitly allow the server domain.
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${FRONTEND_HOST:-localhost}
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./package.json:/app/package.json
      - ./vite.config.ts:/app/vite.config.ts
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  storage_data:
  ppr_documents_data:
  ppr_models_data:
  camera_views_private:
