# Полный стенд: API, воркер детекции и задач, планировщик, база, брокер, фронтенд.
# Запуск: make up   (или docker compose up --build)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stroy
      POSTGRES_PASSWORD: stroy
      POSTGRES_DB: stroy_control
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Наружу нестандартный порт: на машинах участников часто уже стоит
      # локальный PostgreSQL, и 5432 оказывается занят. Внутри сети compose
      # сервисы по-прежнему ходят на 5432.
      - "5433:5432"
    healthcheck:
      # Остальные сервисы ждут именно готовности принимать запросы,
      # а не просто старта контейнера.
      test: ["CMD-SHELL", "pg_isready -U stroy -d stroy_control"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # То же соображение, что и с PostgreSQL: локальный Redis не должен
      # мешать поднять стенд.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: stroy-control-backend:latest
    env_file:
      - ./backend/.env
    build: ./backend
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      ENVIRONMENT: docker
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      STORAGE_LOCAL_ROOT: /app/var/storage
      PPR_STORAGE_ROOT: /app/var/documents
      CAMERA_VIEW_STORAGE_ROOT: /app/var/camera-views-private
      PPR_PROVIDER: ${PPR_PROVIDER:-openrouter}
      PPR_ANALYSIS_MODEL: ${PPR_ANALYSIS_MODEL:-openai/gpt-4o-mini}
      STORAGE_PUBLIC_URL: http://localhost:8000/media
      REPORT_LLM_ENABLED: ${REPORT_LLM_ENABLED:-false}
      REPORT_LLM_MODEL: ${REPORT_LLM_MODEL:-gpt-5.5}
      REPORT_LLM_REASONING_EFFORT: ${REPORT_LLM_REASONING_EFFORT:-low}
      REPORT_LLM_TIMEOUT_SECONDS: ${REPORT_LLM_TIMEOUT_SECONDS:-30}
      REPORT_LLM_MAX_RETRIES: ${REPORT_LLM_MAX_RETRIES:-2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      DOCUMENT_LLM_PROVIDER: ${DOCUMENT_LLM_PROVIDER:-openai_compatible}
      DOCUMENT_LLM_API_KEY: ${DOCUMENT_LLM_API_KEY:-}
      DOCUMENT_LLM_MODEL: ${DOCUMENT_LLM_MODEL:-openai/gpt-4o-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
      YOLO_WEIGHTS_PATH: ${YOLO_WEIGHTS_PATH:-/app/weights/construction-yolov8m-v2.pt}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    volumes:
      # Код примонтирован — правки применяются без пересборки образа.
      - ./backend:/app
      - storage_data:/app/var/storage
      - ppr_documents_data:/app/var/documents
      - camera_views_private:/app/var/camera-views-private
      # Исходные файлы организаторов (справочник работ, ссылки на датасеты).
      - ./data:/app/data:ro
      - ./info:/app/info:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: stroy-control-backend:latest
    env_file:
      - ./backend/.env
    build: ./backend
    # Очереди задач: default (фоновые), cv (детекция), ppr (анализ документов по API).
    command: celery -A app.workers.celery_app:celery_app worker -Q default,cv,ppr -c 2 -l info
    environment:
      ENVIRONMENT: docker
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      STORAGE_LOCAL_ROOT: /app/var/storage
      PPR_STORAGE_ROOT: /app/var/documents
      CAMERA_VIEW_STORAGE_ROOT: /app/var/camera-views-private
      PPR_PROVIDER: ${PPR_PROVIDER:-openrouter}
      PPR_ANALYSIS_MODEL: ${PPR_ANALYSIS_MODEL:-openai/gpt-4o-mini}
      REPORT_LLM_ENABLED: ${REPORT_LLM_ENABLED:-false}
      REPORT_LLM_MODEL: ${REPORT_LLM_MODEL:-gpt-5.5}
      REPORT_LLM_REASONING_EFFORT: ${REPORT_LLM_REASONING_EFFORT:-low}
      REPORT_LLM_TIMEOUT_SECONDS: ${REPORT_LLM_TIMEOUT_SECONDS:-30}
      REPORT_LLM_MAX_RETRIES: ${REPORT_LLM_MAX_RETRIES:-2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      DOCUMENT_LLM_PROVIDER: ${DOCUMENT_LLM_PROVIDER:-openai_compatible}
      DOCUMENT_LLM_API_KEY: ${DOCUMENT_LLM_API_KEY:-}
      DOCUMENT_LLM_MODEL: ${DOCUMENT_LLM_MODEL:-openai/gpt-4o-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
      YOLO_WEIGHTS_PATH: ${YOLO_WEIGHTS_PATH:-/app/weights/construction-yolov8m-v2.pt}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    volumes:
      - ./backend:/app
      - storage_data:/app/var/storage
      - ppr_documents_data:/app/var/documents
      - camera_views_private:/app/var/camera-views-private
      - ./data:/app/data:ro
      - ./info:/app/info:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    image: stroy-control-backend:latest
    build: ./backend
    # Файл расписания пишется вне примонтированного кода, чтобы beat не
    # оставлял служебные файлы в репозитории.
    command: celery -A app.workers.celery_app:celery_app beat -l info --schedule /tmp/celerybeat-schedule
    environment:
      ENVIRONMENT: docker
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      CAMERA_VIEW_STORAGE_ROOT: /app/var/camera-views-private
    volumes:
      - ./backend:/app
      - camera_views_private:/app/var/camera-views-private
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      # Empty: the browser uses the site's hostname and API port 8000.
      # Set an explicit public API origin when using a domain or HTTPS proxy.
      VITE_API_URL: ${VITE_API_URL:-}
      # Vite accepts IP addresses by default; explicitly allow the server domain.
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${FRONTEND_HOST:-localhost}
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./package.json:/app/package.json
      - ./vite.config.ts:/app/vite.config.ts
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  storage_data:
  ppr_documents_data:
  camera_views_private:
